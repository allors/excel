name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.1.0). Must already exist.'
        required: true

permissions:
  contents: write   # create GitHub Release
  id-token: write   # NuGet.org trusted publishing (OIDC)

jobs:
  release:
    runs-on: windows-latest   # task pack needs full MSBuild + Office/VSTO workload
    timeout-minutes: 60
    environment: nuget-release
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      CONFIGURATION: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Import VSTO signing certificate
        run: Import-PfxCertificate -FilePath src/Allors.Excel.Interop.Vsto/ExcelAddIn.VSTO_TemporaryKey.pfx -CertStoreLocation Cert:\CurrentUser\My

      - name: Install go-task
        run: choco install go-task -y --no-progress

      - name: Pack
        run: task pack CONFIGURATION=$env:CONFIGURATION

      - name: Login to NuGet.org (trusted publishing via OIDC)
        id: nuget-login
        uses: nuget/login@v1
        with:
          user: allors-nuget

      - name: Push to NuGet.org
        run: |
          $packages = Get-ChildItem artifacts/nuget -Filter *.nupkg |
            Where-Object { $_.Name -notlike '*.symbols.nupkg' }
          foreach ($p in $packages) {
            dotnet nuget push $p.FullName --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: artifacts/nuget/*.nupkg
